services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
  mongo:
    image: mongo:7
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo-data:/data/db"]
volumes:
  redis-data:
  mongo-data: